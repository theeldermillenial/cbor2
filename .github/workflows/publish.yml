name: Publish packages to PyPI

on:
  push:
    branches: [scratch/cbor2pure-6.1.5-ci]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+.post[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+[a-b][0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+rc[0-9]+"

jobs:
  binary-wheels:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Install the Rust toolchain
      uses: actions-rs/toolchain@v1
      if: runner.os == 'Windows'
      with:
        toolchain: stable
    - name: Build wheels
      uses: pypa/cibuildwheel@v4.2
      env:
        CIBW_ARCHS: "auto"
        CIBW_TEST_GROUPS: "test"
        # The tests need stock cbor2, which the wheel's own dependency installs
        CIBW_TEST_COMMAND: "pytest {project}/tests"
        # Install Rust in cibuildwheel environments
        CIBW_BEFORE_ALL_LINUX: curl -sSf https://sh.rustup.rs | sh -s -- -y
        CIBW_ENVIRONMENT_LINUX: "PATH=$HOME/.cargo/bin:$PATH"
        CIBW_BEFORE_ALL_MACOS: curl -sSf https://sh.rustup.rs | sh -s -- -y
        CIBW_ENVIRONMENT_MACOS: "PATH=$HOME/.cargo/bin:$PATH"
    - uses: actions/upload-artifact@v7
      with:
        name: wheels-${{ matrix.os }}
        path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.x
    - name: Install dependencies
      run: pip install build
    - name: Create the sdist
      run: python -m build -s .
    - uses: actions/upload-artifact@v7
      with:
        name: sdist
        path: dist/*

