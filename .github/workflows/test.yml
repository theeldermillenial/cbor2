name: Test suite

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "pypy-3.11"]
        include:
        - os: macos-latest
          python-version: "3.10"
        - os: macos-latest
          python-version: "3.14"
        - os: windows-latest
          python-version: "3.10"
        - os: windows-latest
          python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install the project and its dependencies
      run: pip install --group test -e .
      env:
        RUST_BACKTRACE: "1"
        RUSTFLAGS: "--deny warnings"
    - name: Show the installed cbor2 and cbor2pure
      run: pip show cbor2 cbor2pure
    - name: Test with pytest
      run: python -m pytest -v
      env:
        TZ: America/New_York

  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Run clippy
      run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- --deny warnings

  test-i686:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build and test in 32-bit container
      run: |
        HOST_UID="$(id -u)"
        HOST_GID="$(id -g)"
        docker run \
          --platform linux/i386 \
          --user "${HOST_UID}:${HOST_GID}" \
          -v "${{ github.workspace }}:/workspace" \
          -w /workspace \
          -e RUST_BACKTRACE=1 \
          -e "RUSTFLAGS=--deny warnings" \
          -e TZ=America/New_York \
          python:3.14 \
          bash -c '
            export CARGO_HOME=/tmp/cargo
            export RUSTUP_HOME=/tmp/rustup
            mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path --default-host i686-unknown-linux-gnu &&
            export PATH="$PATH:$CARGO_HOME/bin" &&
            python -m venv .venv &&
            source .venv/bin/activate &&
            pip install --group test -e . &&
            python -m pytest --color=yes -v
          '
